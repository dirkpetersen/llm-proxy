# LLM Proxy Configuration
# This file configures rate limiting, cost tracking, and model-specific settings

# Development configuration

enabled: true

features:
  cost_tracking:
    enabled: false
  api_key_management:
    enabled: false
  rate_limiting:
    enabled: false

# Enable local LLM providers for development
local_llms:
  gpt-oss:
    enabled: true
    default_model: "openai/gpt-oss-120b"
    thinking_tag_fix: true
    request_timeout: ${LOCAL_LLM_TIMEOUT:-120}
    max_retries: ${LOCAL_LLM_RETRY_COUNT:-2}
    models:
      "openai/gpt-oss-120b":
        enabled: true
        endpoints:
          - url: "${GPT_OSS_ENDPOINT_1:-http://192.168.1.100:8000/v1}"
            api_key: "${GPT_OSS_API_KEY:-}"
          - url: "${GPT_OSS_ENDPOINT_2:-http://192.168.1.101:8000/v1}"
            api_key: "${GPT_OSS_API_KEY:-}"
        pricing:
          input: 0.1
          output: 0.4
  qwen:
    enabled: true  # Enable for development testing
    default_model: "qwen/qwen3-next-80b-a3b-thinking"
    thinking_tag_fix: true
    request_timeout: ${LOCAL_LLM_TIMEOUT:-120}
    max_retries: ${LOCAL_LLM_RETRY_COUNT:-2}
    models:
      "qwen/qwen3-next-80b-a3b-thinking":
        enabled: true
        endpoints:
          - url: "${QWEN_ENDPOINT_1:-http://192.168.1.200:8001/v1}"
            api_key: "${QWEN_API_KEY:-}"
          - url: "${QWEN_ENDPOINT_2:-http://192.168.1.201:8001/v1}"
            api_key: "${QWEN_API_KEY:-}"
        pricing:
          input: 0.0
          output: 0.0

# Enable Claude Code proxy for development
claude_code_proxy:
  enabled: true
  target_provider: "qwen"
  target_model: "qwen/qwen3-next-80b-a3b-thinking"
  unified_endpoint: "/cc-local/v1/messages"
  supported_providers: ["qwen", "gpt-oss"]
  parameter_mapping:
    max_tokens: "max_tokens"



# AWS Bedrock provider (uses IAM authentication)
# Region is read from ~/.aws/config profile, no default needed
bedrock:
  enabled: ${BEDROCK_ENABLED:-false}
  region: ${AWS_REGION:-}
  profile: ${AWS_PROFILE:-bedrock}

# Multi-Provider (Federated Model Routing)
# Enables automatic failover between on-prem primary and cloud fallback
multi_provider:
  enabled: true
  health_check_interval: 30  # seconds between health checks
  models:
    # GPT-OSS model with Bedrock fallback
    gpt-oss-120b:
      enabled: true
      aliases:
        - "openai/gpt-oss-120b"
        - "gpt-oss"
      primary:
        provider: "gpt-oss"
        model: "openai/gpt-oss-120b"
        max_latency_ms: 5000
        max_queue_depth: 50
      fallback:
        provider: "bedrock"
        model: "openai.gpt-oss-120b-1:0"
      strategy: "primary-with-failover"

    # Qwen model with Claude fallback
    qwen3-thinking:
      enabled: true
      aliases:
        - "qwen/qwen3-next-80b-a3b-thinking"
        - "qwen-thinking"
      primary:
        provider: "qwen"
        model: "qwen/qwen3-next-80b-a3b-thinking"
        max_latency_ms: 5000
        max_queue_depth: 50
      fallback:
        provider: "bedrock"
        model: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
      strategy: "primary-with-failover"

# Claude Code Cloud Proxy (/cc)
# Production Anthropic-compatible endpoint for Claude Code with open-source models
# Users set ANTHROPIC_BASE_URL=https://llm.arcs.oregonstate.edu/cc/v1
#
# Any Fireworks model can be used directly without preconfiguring it here.
# Just use the Fireworks model name (e.g. "glm-5.1") and it will be
# auto-routed to accounts/fireworks/models/<name>.
#
# Preconfigured models below are for:
#   - Custom aliases (e.g. "glm5" -> "hc/glm-5")
#   - Non-Fireworks backends (local vLLM, OpenAI)
#   - Documenting recommended models
claude_code_cloud:
  enabled: true
  # Web search configuration - always enabled for all models
  # Uses Colly web scraper for paginated Bing searches (regular by default, news for news queries)
  web_search:
    enabled: true
    provider: "colly"        # Uses Colly for paginated Bing scraping
    tool_name: "web_search"  # Name of the tool to inject and handle
    max_results: 100         # Max results per search (supports 1000+)
  models:
    # GLM-5 via Fireworks - good general purpose model
    "hc/glm-5":
      backend: "fireworks"
      model: "accounts/fireworks/models/glm-5"
      aliases: ["glm-5", "glm5"]

    # DeepSeek V3 via Fireworks - strong reasoning model
    "hc/deepseek-v3":
      backend: "fireworks"
      model: "accounts/fireworks/models/deepseek-v3p1"
      aliases: ["deepseek-v3", "deepseek"]

    # Kimi K2 via Fireworks - good for function calling/tool use
    "hc/kimi-k2":
      backend: "fireworks"
      model: "accounts/fireworks/models/kimi-k2-instruct-0905"
      aliases: ["kimi", "kimi-k2"]

    # Local Qwen (when GPUs available)
    # "hc/qwen-local":
    #   backend: "local"
    #   model: "qwen/qwen3-next-80b-a3b-thinking"
    #   endpoints:
    #     - url: "${QWEN_ENDPOINT_1}"
    #     - url: "${QWEN_ENDPOINT_2}"
