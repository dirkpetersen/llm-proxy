# =============================================================================
# LOCAL LLM PROVIDERS
# =============================================================================

local_llms:
  gpt-oss:
    enabled: false  # Disabled by default - enable in dev.yml
    default_model: "openai/gpt-oss-120b"
    thinking_tag_fix: true
    request_timeout: ${LOCAL_LLM_TIMEOUT:-60}  # seconds - reasonable default for LLM processing
    max_retries: ${LOCAL_LLM_RETRY_COUNT:-2}
    models:
      "openai/gpt-oss-120b":
        enabled: true
        aliases: ["gpt-oss", "gpt-oss-120b"]
        endpoints:
          - url: "${GPT_OSS_ENDPOINT_1:-http://192.168.1.100:8000/v1}"
            api_key: "${GPT_OSS_API_KEY:-}"  # Optional - can be set via environment
          - url: "${GPT_OSS_ENDPOINT_2:-http://192.168.1.101:8000/v1}" 
            api_key: "${GPT_OSS_API_KEY:-}"
        pricing:
          input: 0.1   # Cost per 1M input tokens (example)
          output: 0.4  # Cost per 1M output tokens (example)

  qwen:
    enabled: false  # Disabled by default - enable in dev.yml  
    default_model: "qwen/qwen3-next-80b-a3b-thinking"
    thinking_tag_fix: true  # Enable <think> tag processing for Qwen
    request_timeout: ${LOCAL_LLM_TIMEOUT:-60}  # seconds - reasonable default for LLM processing
    max_retries: ${LOCAL_LLM_RETRY_COUNT:-2}
    models:
      "qwen/qwen3-next-80b-a3b-thinking":
        enabled: true
        aliases: ["qwen", "qwen-80b", "qwen-thinking"]
        endpoints:
          - url: "${QWEN_ENDPOINT_1:-http://192.168.1.200:8001/v1}"
            api_key: "${QWEN_API_KEY:-}"
          - url: "${QWEN_ENDPOINT_2:-http://192.168.1.201:8001/v1}"
            api_key: "${QWEN_API_KEY:-}"
        pricing:
          input: 0.0  # Local model - no cost
          output: 0.0
      "qwen/qwen3-next-80b-a3b-instruct":
        enabled: true
        aliases: ["qwen-instruct", "qwen-80b-instruct"]
        endpoints:
          - url: "${QWEN_ENDPOINT_1:-http://192.168.1.200:8001/v1}"
            api_key: "${QWEN_API_KEY:-}"
          - url: "${QWEN_ENDPOINT_2:-http://192.168.1.201:8001/v1}"
            api_key: "${QWEN_API_KEY:-}"
        pricing:
          input: 0.05  # Example local LLM pricing
          output: 0.2

# =============================================================================
# CLAUDE CODE PROXY
# =============================================================================

claude_code_proxy:
  enabled: false  # Disabled by default - enable in dev.yml
  target_provider: "qwen"
  target_model: "qwen/qwen3-next-80b-a3b-thinking"
  parameter_mapping:
    max_tokens: "max_completion_tokens"  # Claude uses max_tokens, but local LLMs may use max_completion_tokens

# =============================================================================
# MULTI-PROVIDER (FEDERATED) MODEL ROUTING
# =============================================================================
# Enables high-availability routing with automatic failover between on-premises
# and cloud backends. Requests are routed to the primary (on-prem) backend when
# available and healthy, with automatic failover to the fallback (cloud) backend.

multi_provider:
  enabled: false  # Disabled by default - enable in onprem.yml
  health_check_interval: 30  # Health check interval in seconds

  models:
    # GPT-OSS 120B: On-prem vLLM with AWS Bedrock failover
    gpt-oss-120b:
      enabled: true
      aliases: ["openai/gpt-oss-120b", "gpt-oss"]
      primary:
        provider: "gpt-oss"
        model: "openai/gpt-oss-120b"
        max_latency_ms: 5000   # Failover if P95 latency > 5s
        max_queue_depth: 50    # Failover if queue depth > 50
      fallback:
        provider: "bedrock"
        model: "openai.gpt-oss-120b-1:0"
      strategy: "primary-with-failover"

    # GPT-OSS 20B: On-prem vLLM with AWS Bedrock failover
    gpt-oss-20b:
      enabled: true
      aliases: ["openai/gpt-oss-20b"]
      primary:
        provider: "gpt-oss"
        model: "openai/gpt-oss-20b"
        max_latency_ms: 3000
        max_queue_depth: 100
      fallback:
        provider: "bedrock"
        model: "openai.gpt-oss-20b-1:0"
      strategy: "primary-with-failover"

    # Qwen3 with Bedrock failover
    qwen3-235b:
      enabled: true
      aliases: ["qwen/qwen3-235b", "qwen3-235b-a22b"]
      primary:
        provider: "qwen"
        model: "qwen/qwen3-next-80b-a3b-thinking"
        max_latency_ms: 5000
        max_queue_depth: 50
      fallback:
        provider: "bedrock"
        model: "qwen.qwen3-235b-a22b-2507-v1:0"
      strategy: "primary-with-failover"

# =============================================================================
# CLAUDE CODE CLOUD PROXY (/cc)
# =============================================================================
# Production endpoint for Claude Code compatibility with open-source models.
# Users configure ANTHROPIC_BASE_URL to point to /cc and use models like "hc/glm-5"
# which get routed to the configured backend (Fireworks, local vLLM, etc.)
# Any Fireworks model can also be used directly without preconfiguring it.

claude_code_cloud:
  enabled: false  # Disabled by default - enable in onprem.yml
  models:
    # GLM-5 via Fireworks
    "hc/glm-5":
      backend: "fireworks"
      model: "accounts/fireworks/models/glm-5"
      aliases: ["glm-5", "glm5"]

    # DeepSeek V3 via Fireworks
    "hc/deepseek-v3":
      backend: "fireworks"
      model: "accounts/fireworks/models/deepseek-v3p1"
      aliases: ["deepseek-v3", "deepseek"]

    # Qwen 2.5 VL 32B via Fireworks (vision model)
    "hc/qwen-vl-32b":
      backend: "fireworks"
      model: "accounts/fireworks/models/qwen2p5-vl-32b-instruct"
      aliases: ["qwen-vl", "qwen-vision"]

    # Kimi K2 via Fireworks (good for function calling)
    "hc/kimi-k2":
      backend: "fireworks"
      model: "accounts/fireworks/models/kimi-k2-instruct-0905"
      aliases: ["kimi", "kimi-k2"]

    # Example: Local Qwen model (for when GPUs are back)
    # "hc/qwen-local":
    #   backend: "local"
    #   model: "qwen/qwen3-next-80b-a3b-thinking"
